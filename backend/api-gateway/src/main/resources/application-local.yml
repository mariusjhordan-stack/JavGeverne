spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: catalog-products
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: catalog-categories
          uri: http://localhost:8082
          predicates:
            - Path=/api/categories/**
        - id: catalog-brands
          uri: http://localhost:8082
          predicates:
            - Path=/api/brands/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notifications/**
