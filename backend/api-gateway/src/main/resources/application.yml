server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          predicates:
            - Path=/api/auth/**
        - id: catalog-products
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
          predicates:
            - Path=/api/products/**
        - id: catalog-categories
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
          predicates:
            - Path=/api/categories/**
        - id: catalog-brands
          uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
          predicates:
            - Path=/api/brands/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8083}
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
          predicates:
            - Path=/api/notifications/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
