spring:
  datasource:
    url: jdbc:h2:file:./data/auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

server:
  port: 8081

app:
  jwt:
    secret: cronos-geneve-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-dev
    expiration: 3600000
    refresh-expiration: 86400000
