server:
  port: ${ORDER_SERVICE_PORT:8083}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${ORDER_DB_NAME:order_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    internal-token: ${INTERNAL_API_TOKEN}
  catalog-service-url: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
  orders:
    # Unpaid orders keep their stock for this long, then are cancelled and the stock goes back on sale.
    reservation-ttl-minutes: ${ORDER_RESERVATION_TTL_MINUTES:60}
    payment-pending-ttl-hours: ${ORDER_PAYMENT_PENDING_TTL_HOURS:72}
    expiry-job-enabled: true

server.error.include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
