server:
  port: ${CATALOG_SERVICE_PORT:8082}

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${CATALOG_DB_NAME:catalog_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    internal-token: ${INTERNAL_API_TOKEN}
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:3}

server.error.include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.cronos.catalog: INFO
