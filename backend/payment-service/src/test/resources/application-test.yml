spring:
  datasource:
    url: jdbc:h2:mem:payment_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

mercadopago:
  access-token: test-access-token
  webhook-secret: test-webhook-secret-key
  notification-url: http://localhost:8084/api/payments/webhook
  api-base-url: https://api.mercadopago.com

services:
  order-service-url: http://localhost:9999
