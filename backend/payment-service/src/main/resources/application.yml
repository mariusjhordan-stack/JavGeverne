server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    internal-token: ${INTERNAL_API_TOKEN}
  order-service-url: ${ORDER_SERVICE_URL:http://order-service:8083}

stripe:
  # Server-side only. Without them the store still runs but checkout answers 503 and webhooks are refused.
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  success-url: ${STRIPE_SUCCESS_URL:}
  cancel-url: ${STRIPE_CANCEL_URL:}
  webhook-max-age-seconds: ${STRIPE_WEBHOOK_MAX_AGE_SECONDS:300}
  reconcile-enabled: true
  reconcile-interval-ms: ${STRIPE_RECONCILE_INTERVAL_MS:300000}

server.error.include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
