server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${PAYMENT_DB_NAME:payment_db}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    internal-token: ${INTERNAL_API_TOKEN}
  order-service-url: ${ORDER_SERVICE_URL:http://order-service:8083}

mercadopago:
  # Server-side only. Without them the store still runs but checkout answers 503 and webhooks are refused.
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  api-base-url: ${MERCADOPAGO_API_BASE_URL:https://api.mercadopago.com}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Each defaults to FRONTEND_URL + /checkout/{success,failure,pending}
  success-url: ${MP_SUCCESS_URL:}
  failure-url: ${MP_FAILURE_URL:}
  pending-url: ${MP_PENDING_URL:}
  # Public HTTPS URL of POST /api/payments/webhook
  webhook-url: ${MP_WEBHOOK_URL:}
  webhook-max-age-seconds: ${MP_WEBHOOK_MAX_AGE_SECONDS:900}
  reconcile-enabled: true
  reconcile-interval-ms: ${MP_RECONCILE_INTERVAL_MS:300000}

server.error.include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
