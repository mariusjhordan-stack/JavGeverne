name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, catalog-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cronos
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cronos" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configuration and databases
        run: |
          scripts/gen-env.sh
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
          for db in auth_db catalog_db order_db payment_db notification_db; do
            PGPASSWORD=ci-only-password psql -h localhost -U cronos -d postgres -c "CREATE DATABASE $db"
          done
      - name: Install browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: End-to-end suite
        run: scripts/e2e.sh --build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-logs
          path: .run/logs
